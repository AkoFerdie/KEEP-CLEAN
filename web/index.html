<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Keep It Clean - Community waste management app for Cameroon.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Keep It Clean">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#4CAF50">
  <meta name="msapplication-navbutton-color" content="#4CAF50">
  <meta name="apple-mobile-web-app-status-bar-style" content="#4CAF50">

  <title>Keep It Clean - Waste Management App</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #4CAF50;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Roboto', sans-serif;
    }
    
    .loading {
      text-align: center;
      color: white;
    }
    
    .loading h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    
    .loading p {
      font-size: 1rem;
      opacity: 0.9;
    }
    
    .spinner {
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top: 3px solid white;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <h1>Keep It Clean</h1>
    <div class="spinner"></div>
    <p>Loading your waste management app...</p>
  </div>
  
  <script>
    // Request web notification permission for PWA
    if ('Notification' in window) {
      Notification.requestPermission();
    }

    // Called from Flutter via JS channel for web notifications
    window.showPatrolNotification = function(title, body) {
      if ('Notification' in window && Notification.permission === 'granted') {
        var n = new Notification(title, {
          body: body,
          icon: 'icons/Icon-192.png',
          badge: 'icons/Icon-192.png',
          vibrate: [200, 100, 200],
        });
        // Play a beep sound
        try {
          var ctx = new (window.AudioContext || window.webkitAudioContext)();
          var oscillator = ctx.createOscillator();
          var gain = ctx.createGain();
          oscillator.connect(gain);
          gain.connect(ctx.destination);
          oscillator.type = 'sine';
          oscillator.frequency.value = 880;
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
          oscillator.start(ctx.currentTime);
          oscillator.stop(ctx.currentTime + 0.5);
        } catch(e) {}
      }
    };

    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
